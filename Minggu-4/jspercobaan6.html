<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>
    <form name="form1" method="POST">
        <textarea name="question" id="question" cols="60" rows="3" onkeyup="countMax()"></textarea>
        Sisa <input type="text" name="counter" id="counter" size="3" maxlength="3" value="100" readonly>
    </form>
    <script>
        function countMax() {
            const question = document.getElementById("question");
            const counter = document.getElementById("counter");
            const max = 100;
            let wert = max - question.value.length;
            if(wert < 0) {
                alert("Maaf, batas maksimum pengisian adalah " + max + " karakter!");
                question.value = question.value.substring(0, max);
                wert = max - question.value.length;
                counter.value = wert;
            } else {
                counter.value = wert;
            }
        }
    </script>
</body>
</html>
