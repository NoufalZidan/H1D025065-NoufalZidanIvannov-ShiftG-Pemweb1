<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - Modul 2</title>
</head>
<body>
    <form action="post">
        <label>Input 1: </label>
        <input type="text" name="tetap" id="tetap" value="tetap" readonly><br>
        <label>Input 2: </label>
        <input type="text" name="max_5" id="max_5" maxlength="5" placeholder="max 5 karakter"><br>
        <label>Input 3: </label>
        <input type="text" name="disable" id="disable" disabled value="tidak dapat di klik"><br>
        <label>Input 4: </label>
        <input type="text" name="wajib" id="wajib" placeholder="wajib diisi"><br>
        <label>Input 5: </label>
        <input type="text" name="nim" id="nim" maxlength="9" minlength="9" pattern="[A-Za-z0-9]+" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()" required> <br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
