<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Pemrograman Web</title>
    <link rel="stylesheet" href="csspercobaan5.css">
</head>
<body>
    <h2>Free Registration</h2>
    <form action="proses.php" method="post" name="form">
        <table>
            <tr>
                <td class="kolom1">Nama</td>
                <td class="kolom2">:</td>
                <td class="kolom3"><input type="text" name="txtNama" id="txtNama"></td>
            </tr>
            <tr>
                <td class="kolom1">Tgl Lahir</td>
                <td>:</td>
                <td>
                    <input type="text" name="txtTgl" id="txtTgl" maxlength="2">
                    /
                    <input type="text" name="txtBulan" id="txtBulan" maxlength="2">
                    /
                    <input type="text" name="txtTahun" id="txtTahun" maxlength="4">
                </td>
            </tr>
            <tr>
                <td class="kolom1">Alamat</td>
                <td>&nbsp;</td>
                <td><textarea name="txtAlamat" id="txtAlamat"></textarea></td>
            </tr>
            <tr>
                <td class="kolom1">Kota</td>
                <td>:</td>
                <td><input type="text" name="txtKota" id="txtKota"></td>
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>
                    <input type="submit" name="btnKirim" id="btnKirim" value="Kirim">
                    <input type="reset" name="btnCancel" id="btnCancel" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
