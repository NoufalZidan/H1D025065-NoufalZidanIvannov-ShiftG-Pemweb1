<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>
    <p style="border-style: dotted; background-color: red;">Border Dotted Background Red</p>
    <p style="border-style: dashed; background-color: green;">Border Dotted Background Green</p>
    <p style="border-style: solid; background-color: blue;">Border Dotted Background Blue</p>
    <p style="border-style: double; background-color: cyan;">Border Dotted Background Cyan</p>
    <p style="border-style: groove; background-color: magenta;">Border Dotted Background Magenta</p>
    <p style="border-style: ridge; background-color: yellow;">Border Dotted Background Yellow</p>
    <p style="border-style: inset; background-color: orange;">Border Dotted Background Orange</p>
    <p style="border-style: outset; background-color: pink;">Border Dotted Background Pink</p>
</body>
</html>
